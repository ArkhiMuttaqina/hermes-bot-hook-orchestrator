platforms:
  - telegram

default_action: allow
allow_in_dm: true
allow_commands: true
allow_replies_to_bot: true
allow_mentions: true
gate_forum_topics: true

profile_rules:
  admin:
    mode: allow_all
  worker:
    mode: mention_only
  reviewer:
    mode: mention_only

bot_rules:
  team-admin-bot:
    mode: allow_all
  team-worker-bot:
    mode: mention_only
  team-reviewer-bot:
    mode: mention_only
